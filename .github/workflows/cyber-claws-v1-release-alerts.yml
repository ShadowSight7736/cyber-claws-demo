name: Cyber Claws Release Notifier

on:
  release:
    types: [published]

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Send Discord Message
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          TITLE="${{ github.event.release.name }}"
          BODY="${{ github.event.release.body }}"
          GAME_URL="https://cyber-claws-demo.vercel.app/"

          curl -H "Content-Type: application/json" \
            -X POST \
            -d "{\"content\":\"🚀 New Update Released!\n\nVersion: ${VERSION}\nTitle: ${TITLE}\n\n${BODY}\n\n🎮 Play here: ${GAME_URL}\"}" \
            ${{ secrets.DISCORD_WEBHOOK_URL }}
